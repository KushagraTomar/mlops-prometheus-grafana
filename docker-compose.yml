services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: ml-app
    ports:
      - "8000:8000"
    networks:
      - mlops

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9091:9090"
    networks:
      - mlops
    depends_on:
      - app

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - mlops
    depends_on:
      - prometheus

  # Optional: generates realistic traffic (with occasional drift + errors)
  # against the running app. Start with: docker compose --profile demo up
  traffic-generator:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: traffic-generator
    entrypoint: ["python", "/app/scripts/generate_traffic.py", "--url", "http://app:8000/predict", "--rps", "5", "--drift"]
    depends_on:
      - app
    networks:
      - mlops
    profiles: ["demo"]

networks:
  mlops:
    driver: bridge
